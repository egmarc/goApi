services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN in your environment or .env file}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
